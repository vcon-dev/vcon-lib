name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12.8
      uses: actions/setup-python@v3
      with:
        python-version: '3.12.8'
    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH
    - name: Configure Conda Consistency
      run: |
        # Enforce strict channel priority to keep packages consistent
        conda config --set channel_priority strict
        # First, update conda to pick up the latest dependency resolver fixes.
        conda update -n base -c defaults conda -y
        # Then, explicitly install urllib3 into the base environment so that conda's internal libraries work correctly.
        conda install -n base urllib3 -y
    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base
    - name: Lint with flake8
      run: |
        # Install flake8 in the base environment
        conda install flake8 -y
        # Run flake8 to catch Python syntax errors or undefined names.
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Also run flake8 with exit-zero to report any style issues.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        conda install pytest python=3.12 -y
        conda install pytest-mock python=3.12 -y
        pytest
