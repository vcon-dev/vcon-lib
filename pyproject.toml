[tool.poetry]
name = "vcon"
version = "1.0.4"
description = "The vCon library - vCon 0.5.0 (draft-ietf-vcon-vcon-core-05) specification implementation"
authors = ["Thomas McCarthy-Howe <ghostofbasho@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://www.conserver.io/vcon-library"
repository = "https://github.com/vcon-dev/vcon-lib"
documentation = "https://vcon-dev.github.io/vcon-lib/"
keywords = ["vcon", "ietf", "conversation", "call recording", "transcription"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "vcon", from = "src" }
]

[tool.poetry.urls]
"Changelog" = "https://github.com/vcon-dev/vcon-lib/blob/main/CHANGELOG.md"
"Migration guide" = "https://github.com/vcon-dev/vcon-lib/blob/main/MIGRATION_GUIDE.md"
"Issues" = "https://github.com/vcon-dev/vcon-lib/issues"
"Specification" = "https://datatracker.ietf.org/doc/draft-ietf-vcon-vcon-core/"

[tool.poetry.dependencies]
python = "^3.12"
joserfc = "^1.6.8"
uuid6 = "^2024.7.10"
requests = "^2.33.0"
pydash = "^8.0.3"
python-dateutil = "^2.9.0.post0"
mutagen = "^1.47.0"
ffmpeg-python = { version = "^0.2.0", optional = true }
pypdf = "^6.10.2"
pillow = "^12.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
requests = "^2.33.0"
mutagen = "^1.47.0"
sphinx = "<7.0.0"
sphinx-rtd-theme = "^3.0.2"
flake8 = "^7.1.2"
jsonschema = "^4.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
image = ["Pillow", "pypdf"]
video = ["ffmpeg-python"]